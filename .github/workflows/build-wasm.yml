name: Build Rust WebAssembly

on:
  push:
    branches: [main, rust-performance]
    paths:
      - "rust-core/**"
      - ".github/workflows/build-wasm.yml"
  pull_request:
    paths:
      - "rust-core/**"
      - ".github/workflows/build-wasm.yml"

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest
      - name: Run Rust tests
        run: cargo test --manifest-path rust-core/Cargo.toml
      - name: Build WebAssembly package
        run: wasm-pack build rust-core --target web --release --out-dir ../pkg
      - name: Upload WebAssembly package
        uses: actions/upload-artifact@v4
        with:
          name: schedule-wasm-package
          path: pkg/
